<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f2e9">
    <meta name="description" content="{{META_DESCRIPTION}}">
    <meta property="og:type" content="product">
    <meta property="og:site_name" content="ALLAY">
    <meta property="og:title" content="{{TITLE}}">
    <meta property="og:description" content="{{META_DESCRIPTION}}">
    <meta property="og:image" content="{{IMAGE_URL}}">
    <meta property="og:url" content="{{CANONICAL_URL}}">
    <meta property="og:locale" content="es_AR">
    <meta property="product:price:amount" content="{{PRICE}}">
    <meta property="product:price:currency" content="{{CURRENCY}}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{TITLE}}">
    <meta name="twitter:description" content="{{META_DESCRIPTION}}">
    <meta name="twitter:image" content="{{IMAGE_URL}}">
    <title>{{TITLE}}</title>
    <link rel="canonical" href="{{CANONICAL_URL}}">
    <link rel="icon" href="../favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    <script type="application/ld+json">{{PRODUCT_JSON_LD}}</script>
  </head>
  <body class="shop-page">
    <div class="announcement">
      <span>Hecho a mano, para disfrutar sin apuro</span>
      <span class="announcement-dot" aria-hidden="true">✳</span>
      <span>100% libre de gluten</span>
    </div>
    <header class="site-header">
      <a class="wordmark" href="../index.html" aria-label="ALLAY, inicio">
        <img class="wordmark-logo" src="../images/Allay_logo-04_f6f2e9.webp" alt="ALLAY, pastelería sin gluten">
      </a>
      <div class="header-actions">
        <a class="header-cta" href="../products.html">La vitrina</a>
      </div>
    </header>
    <main>
      <section class="shop-section section-wrap">
        <a class="shop-back text-link" href="../products.html">← Volver a la vitrina</a>
        <article class="product-detail">
          <img class="product-detail-image" src="{{IMAGE_URL}}" alt="{{IMAGE_ALT}}">
          <div class="product-detail-content">
            <p class="eyebrow"><span class="eyebrow-line"></span> Hecho a mano, para disfrutar</p>
            <h1>{{NAME}}</h1>
            <p class="product-detail-price"><data value="{{PRICE}}">{{PRICE_DISPLAY}}</data></p>
            <p class="product-detail-description">{{DESCRIPTION}}</p>
          </div>
        </article>
      </section>
    </main>
    <footer class="site-footer">
      <a class="wordmark footer-wordmark" href="../index.html" aria-label="ALLAY, volver al inicio">
        <img class="wordmark-logo" src="../images/Allay_logo-04_f6f2e9.webp" alt="ALLAY">
      </a>
      <p>Hecho con amor, sin gluten. <span>© {{YEAR}} ALLAY</span></p>
      <div class="footer-actions"><a class="footer-social" href="../products.html">La vitrina</a></div>
    </footer>
  </body>
</html>
